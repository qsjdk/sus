external_feature:
    load_feature: false
    save_feature: true
    # feature_path: "/home/sustech/OpenVocabulary/lidar_photo/MyOpenProject/"
    feature_path: "/home/hejun/OpenVocabulary/lidar_photo/MyOpenProject/"

pcnetwork:
    use_net: false
    # net_feature_path: "/home/sustech/OpenVocabulary/lidar_photo/MyOpenProject/outputs/GroundingDINO_SAM/sequences/"
    net_feature_path: "/home/hejun/OpenVocabulary/lidar_photo/MyOpenProject/outputs/GroundingDINO_SAM/sequences/"